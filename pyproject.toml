[project]
name = "sam3-onnx"
version = "0.3.0"
requires-python = ">=3.13"
dependencies = [
    "imgviz>=1.7.6",
    "loguru>=0.7.3",
    "onnx>=1.20.0",
    "opencv-python>=4.11.0.86",
    "osam",
]

[tool.uv]
default-groups = ["dev", "cpu"]
# onnxruntime and onnxruntime-gpu install into the same package directory, and
# so do the cuDNN wheels of torch (CUDA 12) and onnxruntime-gpu (CUDA 13).
conflicts = [[{ group = "cpu" }, { group = "gpu" }], [{ group = "gpu" }, { group = "dev" }]]

[tool.uv.workspace]
members = [
    "sam3",
]

[[tool.uv.dependency-metadata]]
name = "sam3"
version = "0.1.0"
requires-dist = [
    "decord>=0.6.0",
    "einops>=0.8.1",
    "ftfy==6.1.1",
    "huggingface_hub",
    "iopath>=0.1.10",
    "numpy>=2.0.0",  # XXX: requires Numpy 2 for ONNX Runtime compatibility
    "psutil>=7.1.3",
    "pycocotools>=2.0.10",
    "regex",
    "timm>=1.0.17",
    "tqdm",
    "typing_extensions",
]

[tool.ruff]
exclude = ["sam3/"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.ty]
src.exclude = ["sam3/"]

[dependency-groups]
cpu = ["osam[cpu]"]
gpu = ["osam[gpu]"]
dev = [
    "ipython>=9.8.0",
    "onnxscript>=0.5.6",
    "sam3",
    "ty>=0.0.1a34",
    "types-pillow>=10.2.0.20240822",
]

[tool.uv.sources]
sam3 = { workspace = true, editable = true }
osam = { git = "https://github.com/wkentaro/osam", rev = "c45c9968d86532b1d722cd6fbf6d6d9d2f934972" }
